# Deploy from GitHub's network. Campus Wi-Fi blocks SSH port 22;
# GitHub Actions can still reach the droplet (same path as status.neel.world).
#
# Secrets (same values as AI-Manager):
#   STAGING_HOST     = 206.189.129.31
#   STAGING_USER     = neel
#   STAGING_SSH_KEY  = private ed25519 that logs in as neel
name: Deploy droplet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "HANDOFF.md"

concurrency:
  group: codealong-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Known hosts
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          HOST="${STAGING_HOST:-206.189.129.31}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: YouTube cookies
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          mkdir -p deploy
          if [ -n "$YTDLP_COOKIES_B64" ]; then
            echo "$YTDLP_COOKIES_B64" | base64 -d > deploy/youtube-cookies.txt
            echo "wrote youtube cookies from b64 ($(wc -c < deploy/youtube-cookies.txt | tr -d ' ') bytes)"
          elif [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > deploy/youtube-cookies.txt
            echo "wrote youtube cookies from text ($(wc -c < deploy/youtube-cookies.txt | tr -d ' ') bytes)"
          else
            printf '# empty\n' > deploy/youtube-cookies.txt
            echo "no cookie secret — YouTube may require cookies from a datacenter IP"
          fi
          python3 -c "import pathlib; t=pathlib.Path('deploy/youtube-cookies.txt').read_text(); assert '\t' in t or t.strip()=='# empty', 'cookies lost their tabs'"

      - name: Rsync app
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          HOST="${STAGING_USER:-neel}@${STAGING_HOST:-206.189.129.31}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$HOST" 'mkdir -p ~/codealong'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'data/videos/' \
            --exclude 'data/capture/' \
            --exclude 'data/cache/' \
            --exclude '**/.DS_Store' \
            --exclude '/tmp/' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${HOST}:~/codealong/"

      - name: Build and start container
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          HOST="${STAGING_USER:-neel}@${STAGING_HOST:-206.189.129.31}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/codealong"
          docker compose -f deploy/docker-compose.yml up -d --build
          docker compose -f deploy/docker-compose.yml ps
          sleep 8
          curl -sf --max-time 20 http://127.0.0.1:3001/ >/dev/null && echo "codealong http 200" || echo "codealong not answering yet"
          docker exec codealong sh -c 'test -s /secrets/youtube-cookies.txt && cp /secrets/youtube-cookies.txt /tmp/c.txt && python3 -m yt_dlp --cookies /tmp/c.txt --skip-download --print id --no-warnings --extractor-args youtube:player_client=web,android -- nFn2frlTves' \
            && echo "yt-dlp cookies ok" || echo "yt-dlp cookies smoke failed"
          CADDY="$HOME/ai-manager/deploy/Caddyfile"
          SNIP="$HOME/codealong/deploy/Caddyfile.snippet"
          if [ -f "$CADDY" ] && [ -f "$SNIP" ]; then
            if grep -q 'codealong.neel.world' "$CADDY"; then
              echo "Caddy already has codealong.neel.world"
            else
              printf '\n' >> "$CADDY"
              cat "$SNIP" >> "$CADDY"
              echo "appended codealong site to $CADDY"
            fi
            python3 "$HOME/codealong/deploy/insert-ocr-handle.py"
            cd "$HOME/ai-manager"
            docker compose -f deploy/docker-compose.app.yml --env-file deploy/.env.staging --profile tls restart caddy || true
            echo "caddy restarted"
            sleep 3
            curl -sS -o /tmp/ocr-health.json -w "ocr-path:%{http_code}\n" --max-time 15 \
              http://127.0.0.1:3001/api/videos/W6NZfCO5SIk/status || true
            curl -sS -o /tmp/ocr-via-caddy.json -w "ocr-caddy:%{http_code}\n" --max-time 15 \
              https://status.neel.world/codealong-ocr/api/videos/W6NZfCO5SIk/status || true
            head -c 200 /tmp/ocr-via-caddy.json; echo
          else
            echo "No $CADDY — add the snippet by hand and reload Caddy."
          fi
          REMOTE
